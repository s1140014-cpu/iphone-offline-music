<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820"><title>離線音樂播放器</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;background:#101820;color:#f4f7fa;margin:0;padding:18px;line-height:1.45}main{max-width:720px;margin:auto}.panel{background:#18232d;border:1px solid #30414d;border-radius:14px;padding:15px;margin:14px 0}button,input,select{font:inherit;padding:10px;border-radius:8px;max-width:100%}button{border:0;background:#00c8b4;color:#00221f;font-weight:650;margin:4px 4px 4px 0}button.secondary{background:#30414d;color:white}button.danger{background:#7b3038;color:white}input,select{background:#0e171e;color:white;border:1px solid #40525f;width:100%;box-sizing:border-box}label{display:block;margin:10px 0 4px;color:#b4c2cc}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{color:#b4c2cc;font-size:.9rem}#status{color:#9fe9df;overflow-wrap:anywhere}.song,.playlist{border:1px solid #30414d;border-radius:10px;padding:10px;margin:8px 0;overflow-wrap:anywhere}.meta{font-size:.85rem;color:#b4c2cc;margin:4px 0}audio{width:100%;margin:10px 0}
</style></head><body><main>
<h1>🎵 離線音樂播放器</h1><p class="small">歌曲保存在此瀏覽器。支援的瀏覽器可使用鎖定畫面媒體控制；背景播放仍受 Android/iOS、瀏覽器與省電設定影響。請定期匯出 ZIP 備份，並保留原始 MP3。</p>
<section class="panel"><h2>匯入與備份</h2><input id="files" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg" multiple>
<div class="row"><button id="export">匯出全部歌曲 ZIP</button><button id="import" class="secondary">從 ZIP 還原</button><input id="zipfile" type="file" accept=".zip,application/zip" hidden></div><p id="status" role="status">正在初始化……</p></section>
<section class="panel"><h2>播放中</h2><div id="now" class="small">尚未播放</div><audio id="player" controls></audio></section>
<section class="panel"><h2>我的音樂</h2><label for="search">搜尋</label><input id="search" type="search" placeholder="輸入歌名或檔名"><div class="row"><div><label for="sort">排序</label><select id="sort"><option value="name">名稱 A–Z</option><option value="name-desc">名稱 Z–A</option><option value="big">大小由大到小</option><option value="small">大小由小到大</option><option value="new">最近加入</option><option value="old">最早加入</option></select></div><div><label for="filter">播放清單篩選</label><select id="filter"><option value="">全部歌曲</option></select></div></div><p id="count" class="small"></p><div id="songs"></div></section>
<section class="panel"><h2>播放清單</h2><div class="row"><input id="playlistName" maxlength="80" placeholder="輸入清單名稱"><button id="create">建立清單</button></div><p class="small">歌曲旁按「加入清單」即可加入；清單不會複製音訊檔。</p><div id="playlists"></div></section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id), DB="OfflineMusicLibrary", VER=2;
let db, songs=[], lists=[], objectUrl=null;
let playQueue=[], playIndex=-1;
const player=$("player");
function updateMediaSession(s){
  if(!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s?.name || "離線音樂播放器",
      artist: "本機音樂", album: "離線播放清單"
    });
    navigator.mediaSession.playbackState = player.paused ? "paused" : "playing";
    if (Number.isFinite(player.duration) && player.duration > 0 && navigator.mediaSession.setPositionState) {
      navigator.mediaSession.setPositionState({duration: player.duration, playbackRate: player.playbackRate || 1, position: Math.min(player.currentTime || 0, player.duration)});
    }
  } catch (_) {}
}
function playQueueAt(index){
  if(index < 0 || index >= playQueue.length) return;
  playIndex=index;
  play(playQueue[playIndex]);
}
function playNext(){if(playQueue.length && playIndex < playQueue.length-1) playQueueAt(playIndex+1);}
function playPrevious(){if(player.currentTime > 3){player.currentTime=0;return;} if(playQueue.length && playIndex>0) playQueueAt(playIndex-1); else player.currentTime=0;}
const say=s=>$("status").textContent=s;
const id=prefix=>prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);
const bytes=n=>{if(n<1024)return n+" B";let u=["KB","MB","GB"],i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n>=10?1:2)+" "+u[i]};
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains("songs"))d.createObjectStore("songs",{keyPath:"id"});if(!d.objectStoreNames.contains("playlists"))d.createObjectStore("playlists",{keyPath:"id"});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(Error("請關閉其他播放器分頁後重試"));});}
function all(store){return new Promise((res,rej)=>{let r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function put(store,item){return new Promise((res,rej)=>{let t=db.transaction(store,"readwrite");t.objectStore(store).put(item);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function del(store,key){return new Promise((res,rej)=>{let t=db.transaction(store,"readwrite");t.objectStore(store).delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function refresh(){songs=await all("songs");lists=await all("playlists");render();}
function render(){
 let fs=$("filter"),old=fs.value;fs.replaceChildren(new Option("全部歌曲",""));lists.sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));lists.forEach(p=>fs.add(new Option(p.name,p.id)));if([...fs.options].some(o=>o.value===old))fs.value=old;
 let q=$("search").value.trim().toLocaleLowerCase(),arr=songs.filter(s=>s.name.toLocaleLowerCase().includes(q)),f=fs.value;
 if(f){let p=lists.find(p=>p.id===f),ids=new Set(p?p.songIds:[]);arr=arr.filter(s=>ids.has(s.id));}
 let sort=$("sort").value;arr.sort((a,b)=>sort==="name"?a.name.localeCompare(b.name,"zh-Hant"):sort==="name-desc"?b.name.localeCompare(a.name,"zh-Hant"):sort==="big"?(b.size||0)-(a.size||0):sort==="small"?(a.size||0)-(b.size||0):sort==="old"?(a.addedAt||0)-(b.addedAt||0):(b.addedAt||0)-(a.addedAt||0));
 $("count").textContent=`顯示 ${arr.length}/${songs.length} 首 · 總大小 ${bytes(songs.reduce((n,s)=>n+(s.size||s.data.size),0))}`;
 let root=$("songs");root.replaceChildren();if(!arr.length){root.textContent=songs.length?"沒有符合條件的歌曲。":"尚未匯入歌曲。";}
 arr.forEach(s=>{let card=document.createElement("div");card.className="song";let title=document.createElement("strong");title.textContent=s.name;let meta=document.createElement("div");meta.className="meta";meta.textContent=bytes(s.size||s.data.size)+" · "+new Date(s.addedAt||Date.now()).toLocaleDateString();let actions=document.createElement("div");
 let b=document.createElement("button");b.textContent="播放";b.onclick=()=>{playQueue=arr.slice();playQueueAt(playQueue.findIndex(x=>x.id===s.id));};let a=document.createElement("button");a.className="secondary";a.textContent="加入清單";a.disabled=!lists.length;a.onclick=()=>addToList(s.id);let d=document.createElement("button");d.className="danger";d.textContent="刪除";d.onclick=()=>removeSong(s);actions.append(b,a,d);card.append(title,meta,actions);root.append(card);});
 let pr=$("playlists");pr.replaceChildren();if(!lists.length)pr.textContent="尚未建立播放清單。";
 lists.forEach(p=>{let box=document.createElement("div");box.className="playlist";let title=document.createElement("strong");title.textContent=p.name;let count=document.createElement("p");count.className="small";count.textContent=p.songIds.filter(x=>songs.some(s=>s.id===x)).length+" 首歌曲";let row=document.createElement("div");
 let view=document.createElement("button");view.className="secondary";view.textContent="查看";view.onclick=()=>{fs.value=p.id;render();};
 let play=document.createElement("button");play.textContent="依序播放";play.onclick=()=>playList(p);
 let rename=document.createElement("button");rename.className="secondary";rename.textContent="改名";rename.onclick=async()=>{let n=prompt("新清單名稱",p.name);if(n&&n.trim()){p.name=n.trim();await put("playlists",p);await refresh();}};
 let remove=document.createElement("button");remove.className="danger";remove.textContent="刪除清單";remove.onclick=async()=>{if(confirm("刪除清單？歌曲不會刪除。")){await del("playlists",p.id);await refresh();}};
 row.append(view,play,rename,remove);box.append(title,count,row);pr.append(box);});
}
async function play(s){if(!s.data){say("歌曲資料不存在，請重新匯入或還原備份。");return;}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(s.data);player.src=objectUrl;player.load();$("now").textContent="正在播放："+s.name;updateMediaSession(s);try{await player.play();updateMediaSession(s);say("正在播放："+s.name+"。可嘗試鎖定螢幕或切換其他 App 繼續播放。");}catch{say("歌曲已載入，請按播放器播放鍵開始播放。");}}
async function removeSong(s){if(!confirm("確定刪除 "+s.name+"？請先確認有備份。"))return;await del("songs",s.id);for(let p of lists){p.songIds=p.songIds.filter(x=>x!==s.id);await put("playlists",p);}await refresh();say("歌曲已刪除。");}
$("files").onchange=async e=>{try{let n=0;for(let f of e.target.files){if(!(f.type.startsWith("audio/")||/\.(mp3|m4a|wav|aac|flac|ogg|opus|aiff?)$/i.test(f.name)))continue;let old=songs.find(s=>s.name===f.name&&(s.size||s.data.size)===f.size);await put("songs",{id:old?old.id:id("song"),name:f.name,type:f.type||"application/octet-stream",size:f.size,data:f,addedAt:old?.addedAt||Date.now()});n++;}await refresh();say("匯入完成："+n+" 個音訊檔。");}catch(e){say("匯入失敗："+e.message);}finally{e.target.value="";}};
$("create").onclick=async()=>{let name=$("playlistName").value.trim();if(!name){alert("請輸入清單名稱");return;}if(lists.some(p=>p.name.toLowerCase()===name.toLowerCase())){alert("已有同名清單");return;}await put("playlists",{id:id("list"),name,songIds:[],createdAt:Date.now()});$("playlistName").value="";await refresh();say("已建立清單："+name);};
async function addToList(songId){if(!lists.length)return;let choice=prompt("輸入清單編號：\n"+lists.map((p,i)=>`${i+1}. ${p.name}`).join("\n"),"1");if(choice===null)return;let p=lists[Number(choice)-1];if(!p){alert("編號無效");return;}if(!p.songIds.includes(songId))p.songIds.push(songId);await put("playlists",p);await refresh();say("已加入清單："+p.name);}
async function playList(p){let queue=p.songIds.map(x=>songs.find(s=>s.id===x)).filter(Boolean);if(!queue.length){alert("清單裡沒有歌曲");return;}playQueue=queue;playQueueAt(0);} 
player.addEventListener("ended",()=>{if(playQueue.length && playIndex<playQueue.length-1) playQueueAt(playIndex+1); else if("mediaSession" in navigator) navigator.mediaSession.playbackState="none";});
player.addEventListener("play",()=>{if("mediaSession" in navigator) navigator.mediaSession.playbackState="playing";});
player.addEventListener("pause",()=>{if("mediaSession" in navigator) navigator.mediaSession.playbackState="paused";});
player.addEventListener("loadedmetadata",()=>updateMediaSession(playQueue[playIndex]));
player.addEventListener("timeupdate",()=>{if("mediaSession" in navigator && player.duration && navigator.mediaSession.setPositionState){try{navigator.mediaSession.setPositionState({duration:player.duration,playbackRate:player.playbackRate||1,position:Math.min(player.currentTime||0,player.duration)});}catch(_){}}});
if("mediaSession" in navigator){
  const action=(name,fn)=>{try{navigator.mediaSession.setActionHandler(name,fn);}catch(_){}};
  action("play",()=>player.play()); action("pause",()=>player.pause()); action("stop",()=>{player.pause();player.currentTime=0;});
  action("previoustrack",playPrevious); action("nexttrack",playNext);
  action("seekbackward",d=>{player.currentTime=Math.max(0,player.currentTime-(d.seekOffset||10));});
  action("seekforward",d=>{player.currentTime=Math.min(player.duration||Infinity,player.currentTime+(d.seekOffset||10));});
  action("seekto",d=>{if(Number.isFinite(d.seekTime))player.currentTime=d.seekTime;});
}

// Small ZIP implementation: ZIP "store" method, UTF-8 filenames, no external libraries.
const crcTab=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(a){let c=0xffffffff;for(let b of a)c=crcTab[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
const u16=n=>[n&255,n>>>8&255],u32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];
function join(parts){let n=parts.reduce((a,b)=>a+b.length,0),out=new Uint8Array(n),p=0;for(let b of parts){out.set(b,p);p+=b.length;}return out;}
async function makeZip(entries){let enc=new TextEncoder(),locals=[],centrals=[],offset=0;for(let e of entries){let name=enc.encode(e.name),data=e.data,crc=crc32(data),dt=new Date(),tm=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1),da=((Math.max(1980,dt.getFullYear())-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();let h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(tm),...u16(da),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);locals.push(h,name,data);let c=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(tm),...u16(da),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);centrals.push(c,name);offset+=h.length+name.length+data.length;}let local=join(locals),central=join(centrals),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(central.length),...u32(local.length),...u16(0)]);return join([local,central,end]);}
function read16(v,p){return v.getUint16(p,true)}function read32(v,p){return v.getUint32(p,true)}
async function unzip(buffer){let b=new Uint8Array(buffer),v=new DataView(buffer),dec=new TextDecoder(),end=-1;for(let p=b.length-22;p>=Math.max(0,b.length-65557);p--)if(read32(v,p)===0x06054b50){end=p;break;}if(end<0)throw Error("不是有效 ZIP 檔");let count=read16(v,end+10),pos=read32(v,end+16),out=[];for(let i=0;i<count;i++){if(read32(v,pos)!==0x02014b50)throw Error("ZIP 目錄格式錯誤");let method=read16(v,pos+10),size=read32(v,pos+24),nl=read16(v,pos+28),el=read16(v,pos+30),cl=read16(v,pos+32),off=read32(v,pos+42),name=dec.decode(b.slice(pos+46,pos+46+nl));if(method!==0)throw Error("只支援本播放器產生的 ZIP（未壓縮格式）");if(read32(v,off)!==0x04034b50)throw Error("ZIP 檔案內容格式錯誤");let start=off+30+read16(v,off+26)+read16(v,off+28);out.push({name,data:b.slice(start,start+size)});pos+=46+nl+el+cl;}return out;}
$("export").onclick=async()=>{try{let ss=await all("songs"),pp=await all("playlists");if(!ss.length&&!pp.length){say("沒有可備份的資料");return;}say("正在建立 ZIP 備份……");let entries=[],manifest={format:"OfflineMusicLibraryBackup",version:1,createdAt:new Date().toISOString(),songs:[],playlists:pp};for(let i=0;i<ss.length;i++){let s=ss[i],data=new Uint8Array(await s.data.arrayBuffer()),safe=s.name.replace(/[\\/:*?"<>|]/g,"_"),path=`audio/${String(i+1).padStart(4,"0")}_${safe}`;entries.push({name:path,data});manifest.songs.push({id:s.id,name:s.name,type:s.type||s.data.type||"application/octet-stream",size:data.length,addedAt:s.addedAt||Date.now(),path});}entries.unshift({name:"manifest.json",data:new TextEncoder().encode(JSON.stringify(manifest,null,2))});let blob=new Blob([await makeZip(entries)],{type:"application/zip"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="offline-music-backup-"+new Date().toISOString().slice(0,10)+".zip";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);say(`備份完成：${ss.length} 首歌曲、${pp.length} 個播放清單，${bytes(blob.size)}。`);}catch(e){say("備份失敗："+e.message);}};
$("import").onclick=()=>$("zipfile").click();
$("zipfile").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{say("正在還原 ZIP……");let es=await unzip(await f.arrayBuffer()),me=es.find(x=>x.name==="manifest.json");if(!me)throw Error("找不到 manifest.json");let m=JSON.parse(new TextDecoder().decode(me.data));if(m.format!=="OfflineMusicLibraryBackup"||!Array.isArray(m.songs))throw Error("不是本播放器的備份檔");let map=new Map(es.map(x=>[x.name,x.data])),n=0;for(let s of m.songs){let data=map.get(s.path);if(!data)continue;let blob=new Blob([data],{type:s.type||"application/octet-stream"});await put("songs",{id:s.id||id("song"),name:s.name||s.path.split("/").pop(),type:s.type||blob.type,size:blob.size,data:blob,addedAt:s.addedAt||Date.now()});n++;}for(let p of (m.playlists||[])){if(p&&p.name)await put("playlists",{id:p.id||id("list"),name:p.name,songIds:Array.isArray(p.songIds)?p.songIds:[],createdAt:p.createdAt||Date.now()});}await refresh();say(`還原完成：${n} 首歌曲與 ${(m.playlists||[]).length} 個播放清單。`);}catch(err){say("還原失敗："+err.message);}finally{e.target.value="";}};
$("search").oninput=render;$("sort").onchange=render;$("filter").onchange=render;
async function start(){try{if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>say("歌曲資料可用，但離線快取註冊失敗，請檢查 sw.js。"));db=await openDB();await refresh();say("播放器就緒。");}catch(e){say("初始化失敗："+e.message);}}
start();
</script></body></html>
